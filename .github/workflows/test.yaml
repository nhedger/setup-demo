name: Test

on:
  workflow_call:

jobs:
  bundle:
    name: Create test bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install
      - name: Bundle action
        run: bun run build
      - name: Upload bundled action
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundled-action
          path: |
            dist/**
            action.yaml
  test:
    name: Test (${{ matrix.label }})
    needs: bundle
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            label: 'Ubuntu 24.04 x64'
          - os: ubuntu-24.04-arm
            label: 'Ubuntu 24.04 arm64'
          - os: macos-26-intel
            label: 'macOS 26 x64'
          - os: macos-26
            label: 'macOS 26 arm64'
          - os: windows-2025
            label: 'Windows x64'
          - os: windows-11-arm
            label: 'Windows arm64'

    steps:
      - name: Download bundled action
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundled-action
      - name: Test action
        uses: ./
      